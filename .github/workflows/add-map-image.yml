name: Add map image
run-name: Add ${{ inputs.map }}

# Started by FastDL Automate (plugin sbo_map_picture_publish) or by hand (Actions > Add map image > Run workflow, or
# `gh workflow run`): commits <map>.jpg to main. The picture comes in as base64 (a 512x288 JPEG is well under the input
# size limit). The commit is made through the REST API with the workflow's token, so GitHub signs it (Verified).
# The run name "Add <map>" lets a caller find its run.

on:
  workflow_dispatch:
    inputs:
      map:
        description: Map name (lower case, without .jpg)
        required: true
      image_base64:
        description: The 512x288 JPEG, base64 encoded
        required: true
      replace:
        description: Replace an existing picture
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: add-map-image
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check and commit the picture
        shell: python
        env:
          MAP: ${{ inputs.map }}
          IMAGE: ${{ inputs.image_base64 }}
          REPLACE: ${{ inputs.replace }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        run: |
          import base64
          import json
          import os
          import re
          import struct
          import sys
          import urllib.error
          import urllib.request

          SOF = {0xC0, 0xC1, 0xC2, 0xC3, 0xC5, 0xC6, 0xC7, 0xC9, 0xCA, 0xCB, 0xCD, 0xCE, 0xCF}

          def jpeg_size(data):
              if data[:3] != b"\xff\xd8\xff":
                  return None
              i = 2
              while i + 4 <= len(data):
                  if data[i] != 0xFF:
                      return None
                  marker = data[i + 1]
                  if marker == 0xFF:
                      i += 1
                      continue
                  if marker in (0xD8, 0x01) or 0xD0 <= marker <= 0xD7:
                      i += 2
                      continue
                  length = struct.unpack(">H", data[i + 2:i + 4])[0]
                  if marker in SOF:
                      height, width = struct.unpack(">HH", data[i + 5:i + 9])
                      return width, height
                  i += 2 + length
              return None

          def api(method, path, body=None):
              request = urllib.request.Request(
                  f"{os.environ['API_URL']}/repos/{os.environ['REPOSITORY']}{path}",
                  data=None if body is None else json.dumps(body).encode(),
                  method=method,
                  headers={
                      "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          name = os.environ["MAP"].strip()
          if not re.fullmatch(r"[a-z0-9_.+-]+", name) or name.endswith(".jpg"):
              sys.exit(f"::error::map name must be lower case letters, digits, _ . + - without .jpg: {name!r}")
          path = f"{name}.jpg"
          replace = os.environ["REPLACE"] == "true"
          try:
              data = base64.b64decode(os.environ["IMAGE"], validate=True)
          except Exception as e:
              sys.exit(f"::error::image_base64 is not valid base64: {e}")
          size = jpeg_size(data)
          if size is None:
              sys.exit("::error::not a JPEG")
          if size != (512, 288):
              sys.exit(f"::error::{size[0]}x{size[1]}, must be 512x288")
          print(f"{path}: {len(data)} bytes, 512x288")
          if os.path.exists(path):
              with open(path, "rb") as f:
                  if f.read() == data:
                      print(f"{path} already has this picture: nothing to commit")
                      sys.exit(0)
              if not replace:
                  sys.exit(f"::error::{path} already exists with another picture (set replace to change it)")

          body = {
              "message": f"FastDL Automate: {'Replace' if os.path.exists(path) else 'Add'} {path}",
              "content": base64.b64encode(data).decode("ascii"),
              "branch": "main",
          }
          if os.path.exists(path):
              with open(path, "rb") as f:
                  if f.read() == data:
                      print("No change")
                      sys.exit(0)
              body["sha"] = api("GET", f"/contents/{path}?ref=main")["sha"]
          try:
              commit = api("PUT", f"/contents/{path}", body)["commit"]
          except urllib.error.HTTPError as e:
              sys.exit(f"::error::GitHub error {e.code}: {e.read().decode(errors='replace')[:300]}")
          print(f"Committed {commit['sha']}: {commit['html_url']}")
